name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          # 随包 silueta 模型，避免 rembg 联网下载
          U2NET_HOME: ${{ github.workspace }}/models
          FLASK_DEBUG: "false"
        run: python -m pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package source zip
        run: |
          # 排除 venv / 缓存 / git，打包可部署源码
          zip -r colorflow-web-src.zip . \
            -x "*.venv/*" "*__pycache__/*" "*.git/*" "*.pytest_cache/*" "*dist/*"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: colorflow-web-src
          path: colorflow-web-src.zip
          retention-days: 14
